# Invoice config template (issue #187) — fake data throughout, mirroring the
# .env.example pattern. To write a real invoice:
#
#   1. Copy this file to invoices/<number>.yml (`mkdir -p invoices` first on a
#      fresh clone; the committed .gitignore excludes the whole directory —
#      real configs and PDFs hold client billing details and are never
#      committed).
#   2. Edit the values.
#   3. npm run invoice -- invoices/<number>.yml
#
# The PDF lands next to the config. Full field reference: the zod schema in
# scripts/invoice/config.mts is the source of truth; docs/invoicing.md has the
# usage notes.

invoice:
  number: INV-2026-001
  # Optional document title, default "Invoice" — set e.g. "Statement" for an
  # information-only document.
  # title: Statement
  issueDate: 2026-08-16
  # Optional: omit on a statement that asks for no payment — the DUE box, the
  # "Due by" line and the "due" in "Total due" all drop with it.
  dueDate: 2026-08-30
  # Optional billing period, shown under the title (quarterly, in arrears).
  period: May – August 2026

issuer:
  name: octavo
  contact:
    - Ada Example
    - billing@example.com
  # Bank / payment details, printed line-for-line in the payment block.
  payment:
    - "Example Bank"
    - "Ada Example — 00-0000-0000000-00"
    - "Reference: INV-2026-001"

client:
  name: Example Pétanque Club
  contact:
    - The Treasurer
    - treasurer@example.org.nz

# Invoice currency — every total is stated in this. Line items may carry a
# different native `currency`; those lines are converted (and show the
# original alongside).
currency: NZD

# Exchange rate pin: 1 fxFrom = fxRate units of the invoice currency, as of
# fxDate. Leave all three out for a fresh invoice — the tool fetches the live
# ECB rate (frankfurter.app) and prints these lines for you to paste in. PIN
# THEM before sending: an invoice must be reproducible, and a pinned config
# never silently changes amounts. fxFrom must be the foreign currency the
# items use, so a config copied for another client can't misapply the rate.
# fxRate: 1.6543
# fxDate: 2026-08-15
# fxFrom: USD

items:
  - description: Railway Pro workspace subscription
    qty: 3
    unit: month
    amount: 20.00
    currency: USD
  - description: Resend Pro subscription
    qty: 3
    unit: month
    amount: 20.00
    currency: USD
  - description: Domain registration — example.org.nz (annual, Cloudflare)
    amount: 25.30

# GST — omit entirely unless GST-registered (rate in percent).
# gst:
#   rate: 15

# Optional highlighted banner under the billed-to band — pairs with title:
# Statement / no dueDate for an information-only document.
# notice: For information only — no payment due now.

# Optional closing note, set in the serif italic.
notes: |
  Thank you — it's a pleasure making the magazine with you.
